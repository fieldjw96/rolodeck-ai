# The one place a scheduled ingest workflow's steps are written. Ticket #138: six Sources
# needed a schedule, and each caller workflow in this directory (ingest-sec-form-d.yml,
# ingest-accelerator-batches.yml, ingest-show-hn.yml, ingest-events.yml, ingest-news.yml,
# ingest-ycombinator.yml)
# differs only in its cron, its concurrency group and which npm script it runs — everything
# below is shared so a fix to how a failure is reported lands once, not five times.
#
# `workflow_call` only: this file has no `schedule` or `workflow_dispatch` of its own and
# cannot be run directly from the Actions tab. Each caller supplies both triggers.

name: Ingest run

on:
  workflow_call:
    inputs:
      source-name:
        description: What to call this Source in the job summary and in a failure issue's title.
        required: true
        type: string
      npm-script:
        description: The package.json script this run executes, e.g. ingest:sec-form-d.
        required: true
        type: string
    secrets:
      ROLODECK_INGEST_DATABASE_URL:
        required: true
      ROLODECK_OWNER_ID:
        required: true
      # Only sec-form-d reads this; unset for every other caller, and readEdgarContact()
      # never runs for them so an empty value never matters.
      SEC_EDGAR_CONTACT:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The job token can open issues. Nothing after checkout needs git credentials, and
          # leaving them persisted makes that token readable to `npm ci`'s install scripts and
          # to the ingest run itself.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Every ingest entry point already prints what it did — inserted, updated, rejected,
      # per Source — and exits non-zero on a run that wrote nothing (see each script's own
      # comment for why zero rows is a failure, not a quiet day). `tee` keeps that output for
      # the job summary step below without changing what the process itself does; `pipefail`
      # keeps this step's own exit code the script's, not `tee`'s.
      - name: Run ${{ inputs.npm-script }}
        env:
          ROLODECK_INGEST_DATABASE_URL: ${{ secrets.ROLODECK_INGEST_DATABASE_URL }}
          ROLODECK_OWNER_ID: ${{ secrets.ROLODECK_OWNER_ID }}
          SEC_EDGAR_CONTACT: ${{ secrets.SEC_EDGAR_CONTACT }}
        run: |
          set -o pipefail
          npm run ${{ inputs.npm-script }} 2>&1 | tee /tmp/ingest-output.log

      # Runs whether the step above passed or failed, so a failed run's rejections are in the
      # summary too, not just a run that happened to succeed. The log may not exist at all if
      # a step before the script ran — checkout, setup-node, npm ci — is what failed instead;
      # that is still worth a summary saying so, rather than this step itself failing on a
      # missing file and burying the real cause in the job's raw log.
      # GitHub masks secrets in the job log but not in the step summary, so a driver error that
      # printed a connection string would land unmasked on the run page. That is a secrecy
      # problem and it is solved here by redacting credentials, not by only admitting lines
      # whose wording is already known.
      #
      # An allowlist of known-good phrases was the previous answer and it lost real failures: a
      # Source that phrased one its own way — "failed," from News, "could not be fetched" from
      # YC — matched nothing and vanished from the summary, while a partial failure that did not
      # fail the job left the summary looking clean. Each Source's own docstring promises such a
      # line is named in the output. Selection below is therefore broad on the failure side, and
      # nothing is ever dropped without the summary saying how much.
      - name: Record what this run did
        if: always()
        run: |
          LINE_CAP=200
          {
            echo "### ${{ inputs.source-name }}"
            echo ""
            echo '```'
            if [ -f /tmp/ingest-output.log ]; then
              # Credentials in any URI, and any `password=`, before anything is shown.
              redacted=$(sed -E \
                -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@[:space:]]+:[^@[:space:]]+@#\1***:***@#g' \
                -e 's#([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]=)[^[:space:]&]+#\1***#g' \
                /tmp/ingest-output.log)

              # What the run did, plus anything that went wrong. A Source's own wording is not
              # trusted to match, so the second half is deliberately wide.
              selected=$(printf '%s\n' "$redacted" | grep -iE \
                'inserted|updated|wrote|stored|searched|companies|events|profiles|rejected|skipped|fail|error|refus|denied|could not|unable|timed out|429' \
                || true)
              total=$(printf '%s\n' "$selected" | grep -c . || true)

              if [ "$total" -eq 0 ]; then
                echo "(nothing matched: see the Run step's log for what happened)"
              else
                printf '%s\n' "$selected" | head -n "$LINE_CAP"
                if [ "$total" -gt "$LINE_CAP" ]; then
                  echo "... and $((total - LINE_CAP)) more matching line(s); see the Run step's log."
                fi
              fi
            else
              echo "(no output: a step before the script ran did not complete)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue per Source, not one per failed run: a Source down for a week must
      # produce one issue to read, not seven to ignore. Matched on the exact title a prior
      # run of this same Source would have used, so a second failure while the first issue is
      # still open adds a comment instead of opening a duplicate.
      - name: Open or update an issue for a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # Read by jq below as env.TITLE. gh's --jq takes one expression and has no --arg,
          # which is what the previous version passed: gh rejected the call as
          # "unknown arguments", bash stopped the step there, and no failure of any Source
          # ever opened an issue. News and Events failed daily with nothing in the queue.
          TITLE: "Ingest failure: ${{ inputs.source-name }}"
        run: |
          title="$TITLE"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled ingest run for **${{ inputs.source-name }}** failed. See the run: $run_url"
          fi
