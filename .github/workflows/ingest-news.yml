# Daily: News goes stale by definition. See docs/ingest.md's "Scheduled runs" for the full list.
#
# A zero-article run is not a failure here, unlike every other Source: lib/news/run.ts's
# `newsRunFailed` only trips when not one feed in `NEWS_FEEDS` could be fetched and parsed.
# Until something is Kept there is nothing to match a feed's articles against, and after that a
# quiet month for a two-person startup is a legitimate answer. A feed that has changed shape does
# not quietly return nothing: it fails to parse, by name. When every feed fails that fails the
# run; when others were read it is named in the job summary. See that file's own comment.

name: Ingest - News

on:
  schedule:
    - cron: "20 8 * * *" # 08:20 UTC daily, after ingest-events
  workflow_dispatch: {}

concurrency:
  group: ingest-news
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    uses: ./.github/workflows/ingest-run.yml
    with:
      source-name: news
      npm-script: ingest:news
    secrets:
      ROLODECK_INGEST_DATABASE_URL: ${{ secrets.ROLODECK_INGEST_DATABASE_URL }}
      ROLODECK_OWNER_ID: ${{ secrets.ROLODECK_OWNER_ID }}
