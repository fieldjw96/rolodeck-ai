# Daily: News goes stale by definition. See README.md's "Scheduled runs" for the full list.
#
# A zero-article run is not a failure here, unlike every other Source: lib/news/run.ts's
# `newsRunFailed` only trips on a company GNews could not be searched for at all — a quiet
# month for a two-person startup is a legitimate answer, not a rotted selector, and there is
# no selector here to rot since GNews is a JSON API. See that file's own comment.

name: Ingest - News

on:
  schedule:
    - cron: "20 8 * * *" # 08:20 UTC daily, after ingest-events
  workflow_dispatch: {}

concurrency:
  group: ingest-news
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    uses: ./.github/workflows/ingest-run.yml
    with:
      source-name: news
      npm-script: ingest:news
    secrets:
      ROLODECK_INGEST_DATABASE_URL: ${{ secrets.ROLODECK_INGEST_DATABASE_URL }}
      ROLODECK_OWNER_ID: ${{ secrets.ROLODECK_OWNER_ID }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
