# Daily: News goes stale by definition. See docs/ingest.md's "Scheduled runs" for the full list.
#
# A zero-article run is not a failure here, unlike every other Source: lib/news/run.ts's
# `newsRunFailures` only trips when not one feed in `NEWS_FEEDS` could be fetched and parsed, or
# when every history search it tried failed. A quiet month for a two-person startup is a
# legitimate answer, whoever is watching it. A feed that has changed shape does
# not quietly return nothing: it fails to parse, by name. When every feed fails that fails the
# run; when others were read it is named in the job summary. See that file's own comment.

name: Ingest - News

on:
  schedule:
    - cron: "20 8 * * *" # 08:20 UTC daily, after ingest-events
  workflow_dispatch: {}

concurrency:
  group: ingest-news
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    uses: ./.github/workflows/ingest-run.yml
    with:
      source-name: news
      npm-script: ingest:news
    secrets:
      # The only credential News needs. Gathering is for the whole Catalogue, so there is no
      # User for it to be told about: ADR 0022 removed the variable that named one.
      ROLODECK_INGEST_DATABASE_URL: ${{ secrets.ROLODECK_INGEST_DATABASE_URL }}
