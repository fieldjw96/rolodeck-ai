# The CI wall every Ticket has to clear: typecheck, lint, format, test and build all have
# to be green before the Claude Review Gate is even worth running. See CLAUDE.md's
# "Definition of done" and docs/adr/0001 for why this repo merges on green with nobody
# looking.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A known-vulnerable dependency is a defect like any other, so it fails the same wall.
      # `high` and above only: a moderate advisory in a build-time tool is not worth blocking
      # an unattended merge on, and a wall that cries wolf gets turned off.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Asks the artefact, not the source, whether a secret can reach a browser. Has to come
      # after the build: it greps what the build produced.
      - run: npm run check:bundle-secrets

  # Ticket #17: the app has to build for someone who has only `.env.example` to go on — a
  # fresh Vercel project, or Jack setting one up. This job proves it: the variables it sets
  # are read straight out of `.env.example` (values and all, since none of them are real), so
  # a variable added there without a matching line here cannot happen — there is exactly one
  # place to add it. The job declares no other `env:`, and GitHub Actions jobs get no secret
  # unless a step asks for one by name, so nothing else is available to paper over a variable
  # the app needed but nobody documented.
  build-with-documented-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load only the variables .env.example documents
        run: grep -E '^[A-Z_]+=' .env.example >> "$GITHUB_ENV"
      - run: npm run build

  # Ticket #16: an explicit, enforced budget for `/deck` rather than an implicit "it feels
  # fine", plus the accessibility and layout specs. They build and start their own server
  # against the in-process Supabase Auth stub — see `e2e/deck-performance.spec.ts` — so, like
  # `migrate`, this needs no secret this repo's CI does not already have. It does now need a
  # Postgres, for the reason below.
  perf:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default, so a suite that wedges is reported
    # hours later as a red check with nothing readable attached. Playwright's own `globalTimeout`
    # is set below this so the run fails, and prints why, before the job is killed for time.
    timeout-minutes: 30
    # This suite mocks `/api/*` in the browser and needed no database until Ticket #191 put the
    # first-run check on the `(app)` layout, which reads the User Profile on the server. A
    # server-side query is not something `page.route` can answer, so with no Postgres every page
    # in the group redirects to `/onboarding` and every spec here fails to find what it looks
    # for. A Postgres of its own rather than one shared with `e2e-db`:
    # `e2e/support/scratch-database.ts` sets a password on `rolodeck_app` once per process, and
    # two jobs doing that to one cluster would lock each other out.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Privileged on purpose: the suite applies the shim, applies the migrations and sets the
      # app role's password with this, then hands the app under test a `rolodeck_app` string
      # built from it. Production splits those two jobs across `MIGRATION_DATABASE_URL` and
      # `SUPABASE_POOLER_URL`; see docs/adr/0005 and docs/adr/0014.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Ticket #13: the core swipe flow — Keep, Pass, the Watchlist, and the Deck's empty state —
  # against a real Postgres and a real browser, not the mocked `/api/profiles` the `perf` job's
  # specs use. Its own job with its own service container, and `perf` now has one too: both
  # stand a database up through `e2e/support/scratch-database.ts`, which sets a password on
  # `rolodeck_app`, so sharing one cluster between them would have each lock the other out.
  e2e-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:db

  # The integration tests run Postgres in-process, which proves the policies behave but not
  # that the migration applies to a stock server. This job is that second question: a
  # scratch Postgres, the Supabase shim, then the migration, from empty.
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stand in for the Supabase-managed roles and auth schema
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f db/testing/supabase-shim.sql
      - run: npm run db:migrate
