# Second-agent review, the last Gate before a pull request can auto-merge (agent-harness
# ADR 0004, ADR 0009). This repo has no human in that loop at all: the approve/request-
# changes verdict this workflow leaves is the only thing standing between a Run's PR and
# it merging itself.
#
# The verdict is posted by a deterministic shell step, not by the agent. An earlier version
# asked the agent to call `gh pr review` itself and it silently did not on PR #19: the job
# exited 0 having posted nothing, reviewDecision stayed empty, auto-merge (which requires
# APPROVED) never fired, and the Ticket queue stalled behind it for seven hours with every
# check green and no error anywhere. The agent now only writes a verdict file; this
# workflow reads it and does the posting. A missing or unparseable file fails the job
# loudly rather than passing with no verdict.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`) and the Claude
# GitHub App installed on the repo.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Run /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            to review this pull request cold and post findings as inline comments.

            Then write your verdict to the file /tmp/verdict.txt. This is the only way your
            verdict is recorded; nothing else you do decides whether this PR can merge.
            Write exactly one of these two forms, and nothing else:

              APPROVE<newline><one-line summary>
              REQUEST_CHANGES<newline><one-line summary of what is wrong>

            Base it only on CONFIRMED findings that are correctness bugs. Style,
            simplification and efficiency suggestions belong in inline comments, not in a
            REQUEST_CHANGES verdict.

            Writing this file is mandatory. If you finish without writing it, the job fails
            and a correct PR is blocked, so write it even when you found nothing at all.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(cat:*)"

      - name: Post the verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/verdict.txt ]; then
            echo "::error::The review agent produced no verdict file. Failing rather than" \
                 "leaving this PR with an empty reviewDecision, which reads as 'not approved'" \
                 "to auto-merge and stalls the queue silently. Re-run this job."
            exit 1
          fi

          verdict=$(head -n 1 /tmp/verdict.txt | tr -d '\r' | tr -d '[:space:]')
          summary=$(tail -n +2 /tmp/verdict.txt | head -c 60000)
          [ -n "$summary" ] || summary="(no summary given)"

          case "$verdict" in
            APPROVE)
              echo "Verdict: APPROVE"
              gh pr review "$PR" --approve --body "$summary"
              ;;
            REQUEST_CHANGES)
              echo "Verdict: REQUEST_CHANGES"
              gh pr review "$PR" --request-changes --body "$summary"
              ;;
            *)
              echo "::error::Unrecognised verdict '$verdict'; expected APPROVE or REQUEST_CHANGES."
              exit 1
              ;;
          esac
