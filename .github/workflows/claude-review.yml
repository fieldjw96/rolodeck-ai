# Second-agent review, the last Gate before a pull request can auto-merge (agent-harness
# ADR 0004 and ADR 0009). This repo has no human in that loop at all: the verdict this
# workflow leaves is the only thing standing between a Run's pull request and it merging
# itself. It is cold by construction, a fresh checkout with no memory of having written the
# code, which is the whole point. An agent reviewing its own work re-derives its own
# assumptions and finds nothing.
#
# Kept byte-identical to the agent-harness copy apart from this header, so the two can be
# diffed against each other. Change them together.
#
# This workflow writes its own review prompt rather than delegating to the `code-review`
# plugin. The plugin version was non-deterministic about recording a verdict: four runs on
# the same branch split two successes and two "no verdict was recorded", because the
# instruction to write the verdict file was a postscript appended to somebody else's slash
# command, and the plugin's own flow had no reason to honour it. Owning the prompt makes
# writing the verdict the last step of our flow instead of a hopeful addendum, and it lets
# the reviewer be given the Ticket, which the plugin had no way to accept.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`) and the Claude
# GitHub App installed on the repo.

name: Claude Review

on:
  pull_request:
    # `synchronize` is deliberately absent. It fired a full review on every push, so a
    # pull request that took three fixes cost four reviews; over one day that was 19
    # review runs against 4 engineering Runs. Re-review after a bounce is requested
    # explicitly by the dispatcher posting `/review`, which is one review per bounce
    # round rather than one per push.
    types: [opened, reopened, ready_for_review]
    # A pull request that edits this file cannot be reviewed: claude-code-action refuses
    # to run unless the workflow is byte-identical to the copy on the default branch
    # ("Workflow validation failed"). It failed in 18 seconds and left a red X on exactly
    # the pull requests that fix the reviewer. Not scheduling the job is honest, where a
    # red check claims a review ran and found something.
    paths-ignore:
      - ".github/workflows/claude-review.yml"
  issue_comment:
    types: [created]

# Both trigger shapes carry the number in a different place.
env:
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
  REPO: ${{ github.repository }}

jobs:
  review:
    # `issue_comment` fires for issues as well as pull requests, and for every comment on
    # both, so the job has to filter down to "/review on a pull request" itself.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # refs/pull/N/head resolves for both trigger shapes, which an `issue_comment` run
      # needs because it starts on the default branch rather than on the pull request.
      # These repos are private and take no outside contributions, so checking out head
      # code is not the fork-privilege problem it would be on a public repo.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      # The most valuable review question is "does this do what the Ticket asked", and the
      # reviewer could not previously ask it: it saw the diff and nothing else. The
      # dispatcher writes `Closes #N` into every pull request body it opens, so the Ticket
      # is recoverable from the pull request without the dispatcher passing anything.
      - name: Fetch the Ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          n=$(printf '%s' "$body" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
                | head -n1 | grep -oE '[0-9]+' || true)
          if [ -n "$n" ]; then
            gh issue view "$n" --repo "$REPO" --json number,title,body \
              --jq '"Ticket #\(.number): \(.title)\n\n\(.body)"' > /tmp/ticket.md
            echo "Reviewing against Ticket #$n."
          else
            printf '%s\n' \
              'This pull request is linked to no Ticket, so there are no Acceptance' \
              'Criteria to check it against. Review it on its own terms.' > /tmp/ticket.md
            echo "No linked Ticket found; reviewing on the diff alone."
          fi
          gh pr diff "$PR" --repo "$REPO" > /tmp/diff.patch
          wc -l /tmp/diff.patch

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ env.PR }} in ${{ env.REPO }}. You did not
            write this code and you have no memory of writing it. Review it cold.

            The Ticket it claims to satisfy is in /tmp/ticket.md. The diff is in
            /tmp/diff.patch. The full repository is checked out in the working directory
            at the pull request's head, so you can read and search any file for context.

            Work in this order:

            1. Read /tmp/ticket.md and /tmp/diff.patch.
            2. Read CLAUDE.md and CONTEXT.md, and any ADR in docs/adr/ whose subject the
               diff touches. A change that contradicts an accepted ADR is a finding even
               when the code is correct.
            3. Decide whether the diff satisfies every line of the Ticket's Acceptance
               Criteria. This is the most important question you answer. A criterion
               silently left unmet is the finding this review exists to catch.
            4. Look for correctness bugs: wrong logic, unhandled failure, a case the code
               does not cover, a claim in a comment the code does not honour.
            5. Post findings as inline comments on the diff.
            6. Write your verdict to /tmp/verdict.txt as your final action.

            The verdict file is the only thing that records your review. Nothing else you
            do records it, and the job fails if the file is missing, so write it even when
            you found nothing at all. Write exactly one of these two forms and nothing
            else:

              APPROVE<newline><one-line summary>
              REQUEST_CHANGES<newline><one-line summary of what is wrong>

            Request changes only for unmet Acceptance Criteria, correctness bugs, or
            contradictions of an accepted ADR. Style, naming, simplification and
            efficiency suggestions belong in inline comments and must not by themselves
            hold up a pull request.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Write,Bash(cat:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      # The agent states a verdict; this step records it. Never let the thing being judged
      # also be the thing that reports the judgement: an earlier version asked the agent to
      # call `gh pr review` itself, enforced only by prose, and in rolodeck-ai it silently
      # did not. That repo auto-merges on APPROVED, so its Ticket queue stalled for seven
      # hours with every check green and nothing to point at.
      - name: Post the verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing file fails the job rather than passing it. Silence here is
          # indistinguishable from a review that never ran, and a sibling repo merges on
          # APPROVED without a human, so passing on silence would merge unreviewed code.
          if [ ! -s /tmp/verdict.txt ]; then
            echo "::error::No verdict file was written, so no review is recorded. Failing" \
                 "rather than passing, which would be indistinguishable from a review that" \
                 "never ran. Comment /review on the pull request to try again."
            exit 1
          fi

          verdict=$(head -n 1 /tmp/verdict.txt | tr -d '\r' | tr -d '[:space:]')
          summary=$(tail -n +2 /tmp/verdict.txt | head -c 60000)
          [ -n "$summary" ] || summary="(no summary given)"

          case "$verdict" in
            APPROVE)
              echo "Verdict: APPROVE"
              gh pr review "$PR" --repo "$REPO" --approve --body "$summary"
              ;;
            REQUEST_CHANGES)
              echo "Verdict: REQUEST_CHANGES"
              gh pr review "$PR" --repo "$REPO" --request-changes --body "$summary"
              ;;
            *)
              echo "::error::Unrecognised verdict '$verdict'; expected APPROVE or REQUEST_CHANGES."
              exit 1
              ;;
          esac
