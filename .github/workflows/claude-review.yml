# Second-agent review, the last Gate before a pull request can auto-merge (agent-harness
# ADR 0004, ADR 0009). This repo has no human in that loop at all: the approve/request-
# changes verdict this workflow leaves is the only thing standing between a Run's PR and
# it merging itself.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`) and the Claude
# GitHub App installed on the repo.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Run /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            to review this pull request cold and post findings as inline comments.

            Then leave exactly one review verdict, based only on CONFIRMED findings that are
            correctness bugs (not style, not simplification, not efficiency suggestions):

            - If there is at least one CONFIRMED correctness bug, run:
              gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<one-line summary of what's wrong>"
            - Otherwise, run:
              gh pr review ${{ github.event.pull_request.number }} --approve --body "<one-line summary, e.g. no correctness issues found>"

            Never finish without leaving one of these two verdicts. This repo auto-merges on
            your approval with nobody else looking, so be as rigorous here as the plugin
            allows.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*)"
        env:
          GH_TOKEN: ${{ github.token }}
